version: "3.9"

services:
  postgres:
    image: postgres:16-alpine

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_system

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3001:3001"

    restart: always

  frontend:
    build:
      context: ./frontend

    env_file:
      - ./frontend/.env.local

    ports:
      - "3000:3000"

    restart: always

    depends_on:
      - backend

volumes:
  postgres_data: